<script>
function update() {
  let current = Math.random();
  let previous = Math.random();

  if (current > previous) {
    document.getElementById("triangle").innerHTML = "▲";
    document.getElementById("triangle").style.color = "#00ff88"; // yeşil
  } else {
    document.getElementById("triangle").innerHTML = "▼";
    document.getElementById("triangle").style.color = "red";
  }
}

update();
setInterval(update, 3000);
</script>

</body>
</html>
