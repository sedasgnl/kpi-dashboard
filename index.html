<html>
<body style="background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;">

<div id="triangle" style="font-size:80px;">▲</div>

<script>
function update() {
  let current = Math.random();
  let previous = Math.random();

  let el = document.getElementById("triangle");

  if (current > previous) {
    el.innerHTML = "▲";
    el.style.color = "#00ff88";
  } else {
    el.innerHTML = "▼";
    el.style.color = "red";
  }
}

update();
setInterval(update, 3000);
</script>

</body>
</html>
